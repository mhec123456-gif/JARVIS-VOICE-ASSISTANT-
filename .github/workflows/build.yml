name: React Vite App Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
        

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build App
        run: npm run build
