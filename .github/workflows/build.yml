name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Convert to Android & Build APK
        run: |
          rm -f build.gradle.kts settings.gradle.kts gradle.properties capacitor.config.ts
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          echo '{"appId": "com.jarvis.voiceassistant", "appName": "Jarvis Assistant", "webDir": "dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
